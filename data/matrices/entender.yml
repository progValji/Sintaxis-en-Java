    public class Main {
      public static void main(String[] args) {
        int[][] m = {
          {1, 2},
          {3, 4}
        };
        System.out.println(m[0][1]);
      }
    }
  pregunta: "¿Qué imprime este código?"
  opciones:
    - "1"
    - "2"
    - "3"
    - "4"
  respuesta: "2"
  explicacion: "m[0][1] corresponde a la primera fila, segunda columna."

- id: 2
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        int[][] m = {
          {1, 2},
          {3, 4}
        };
        int suma = 0;
        for (int i = 0; i < 2; i++) {
          for (int j = 0; j < 2; j++) {
            suma += m[i][j];
          }
        }
        System.out.println(suma);
      }
    }
  pregunta: "¿Qué imprime?"
  opciones:
    - "10"
    - "9"
    - "8"
    - "Error"
  respuesta: "10"
  explicacion: "Se suman todos los elementos de la matriz: 1+2+3+4."

