- title: "1. while"
  description: "Ejecuta un bloque de código mientras la condición sea verdadera. Se evalúa
                la condición antes de cada iteración, por lo que si es falsa desde el inicio,
                el bloque nunca se ejecuta."
  code: |
    int i = 0;

    while (i < 5) {
        System.out.println(i);
        i++;
    }
    // 0 1 2 3 4

- title: "2. do while"
  description: "Similar al while, pero la condición se evalúa al final. Esto garantiza que
                el bloque se ejecute al menos una vez, sin importar si la condición es falsa."
  code: |
    int i = 0;

    do {
        System.out.println(i);
        i++;
    } while (i < 5);
    // 0 1 2 3 4

- title: "3. for"
  description: "El ciclo for concentra en una sola línea la inicialización, la condición y
                el incremento. Es ideal cuando se conoce de antemano el número de iteraciones."
  code: |
    for (int i = 0; i < 5; i++) {
        System.out.println(i);
    }
    // 0 1 2 3 4

- title: "4. for-each"
  description: "Diseñado para recorrer colecciones y arrays de forma simple y legible.
                No requiere manejar índices, por lo que reduce el riesgo de errores."
  code: |
    int[] numeros = {10, 20, 30, 40, 50};

    for (int numero : numeros) {
        System.out.println(numero);
    }
    // 10 20 30 40 50

- title: "5. break"
  description: "Interrumpe el ciclo inmediatamente, sin importar si la condición sigue
                siendo verdadera. El flujo continúa en la línea siguiente al ciclo."
  code: |
    for (int i = 0; i < 10; i++) {
        if (i == 5) {
            break;
        }
        System.out.println(i);
    }
    // 0 1 2 3 4

- title: "6. continue"
  description: "Salta el resto del bloque en la iteración actual y pasa directamente a la
                siguiente. A diferencia de break, el ciclo no termina."
  code: |
    for (int i = 0; i < 10; i++) {
        if (i % 2 == 0) {
            continue;
        }
        System.out.println(i);
    }
    // 1 3 5 7 9

- title: "7. Ciclos anidados"
  description: "Un ciclo dentro de otro. Por cada iteración del ciclo externo, el ciclo
                interno completa todas sus iteraciones. Muy usado para trabajar con matrices
                o generar patrones."
  code: |
    for (int i = 1; i <= 3; i++) {
        for (int j = 1; j <= 3; j++) {
            System.out.print(i * j + "\t");
        }
        System.out.println();
    }
    // 1   2   3
    // 2   4   6
    // 3   6   9