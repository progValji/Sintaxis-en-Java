- id: 1
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        for (int i = 0; i < 3; i++) {
          System.out.print(i);
        }
      }
    }
  pregunta: "¿Qué imprime este código?"
  opciones:
    - "012"
    - "123"
    - "0123"
    - "nada"
  respuesta: "012"
  explicacion: "El ciclo for inicia en 0 y se ejecuta mientras i < 3."

- id: 2
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        int i = 1;
        while (i <= 3) {
          System.out.print(i);
          i++;
        }
      }
    }
  pregunta: "¿Qué imprime?"
  opciones:
    - "123"
    - "012"
    - "321"
    - "Error"
  respuesta: "123"
  explicacion: "El while imprime desde 1 hasta 3 incrementando i."

- id: 3
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        int i = 5;
        do {
          System.out.print(i);
          i--;
        } while (i > 3);
      }
    }
  pregunta: "¿Qué imprime?"
  opciones:
    - "543"
    - "54"
    - "5"
    - "Error"
  respuesta: "54"
  explicacion: "El do-while ejecuta primero con i=5 y luego con i=4; se detiene cuando i=3."

- id: 4
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        for (int i = 1; i <= 5; i++) {
          if (i == 3) {
            break;
          }
          System.out.print(i);
        }
      }
    }
  pregunta: "¿Qué imprime?"
  opciones:
    - "12345"
    - "12"
    - "123"
    - "Error"
  respuesta: "12"
  explicacion: "El break detiene el ciclo cuando i es 3, por eso solo imprime 1 y 2."