    public class Main {
      public static void main(String[] args) {
        int i = 0;
        while (i < 3)
          System.out.println(i);
          i++;
      }
    }
  pregunta: "¿Compila y qué sucede?"
  opciones:
    - "No compila"
    - "Sí, imprime 0 1 2"
    - "Sí, ciclo infinito"
    - "Sí, imprime solo 0"
  respuesta: "Sí, ciclo infinito"
  explicacion: "Faltan llaves, i++ queda fuera del while."

