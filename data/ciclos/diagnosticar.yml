- id: 1
  categoria: encuentra el bug
  codigo: |
    public class Main {
      public static void main(String[] args) {
        for (int i = 0; i < 5; i--)
          System.out.println(i);
      }
    }
  pregunta: "¿Compila y qué sucede?"
  opciones:
    - "No compila"
    - "Sí, ciclo infinito"
    - "Sí, imprime 0 a 4"
    - "Sí, no imprime nada"
  respuesta: "Sí, ciclo infinito"
  explicacion: "i se decrementa, nunca deja de cumplir i < 5."

