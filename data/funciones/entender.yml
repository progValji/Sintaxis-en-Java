  - id: 4
    categoria: comprension de codigo
    codigo: |
      public class Main {
        static int factorial(int n) {
          if (n <= 1) return 1;
          return n * factorial(n-1);
        }
        public static void main(String[] args) {
          System.out.println(factorial(3));
        }
      }
    pregunta: "¿Qué imprime?"
    opciones:
      - "6"
      - "3"
      - "1"
      - "error"
    respuesta: "6"
    explicacion: "3*2*1=6."  