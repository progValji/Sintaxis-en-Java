- id: 4
  categoria: comprension de codigo
  codigo: |
    public class Main {
      public static void main(String[] args) {
        String s = "abc";
        for (int i = 0; i < s.length(); i++) {
          System.out.print(s.charAt(i));
        }
      }
    }
  pregunta: "¿Qué imprime?"
  opciones:
    - "abc"
    - "cba"
    - "aabbcc"
    - "Error"
  respuesta: "abc"
  explicacion: "Recorre el string desde el inicio hasta el final."